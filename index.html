<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a7f5a">
<title>オフライン画像・文書 意味検索 v0.1</title>
<style>
:root{color-scheme:light dark;--fg:#1c1c1c;--bg:#f7f7f3;--card:#ffffff;--line:#d8d8d2;--ok:#1a7f5a;--ng:#b3261e;--muted:#6b6b66}
@media(prefers-color-scheme:dark){:root{--fg:#ececea;--bg:#161614;--card:#1f1f1d;--line:#3a3a36;--muted:#9a9a94}}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
main{max-width:640px;margin:0 auto}
h1{font-size:1.3rem;margin:.25rem 0 0}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 1rem}
.banner{background:var(--ok);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;margin:0 0 1rem}
ul{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.k{display:block;color:var(--muted);font-size:.8rem}
.v{font-weight:600;word-break:break-all}
.ok{color:var(--ok)}
.ng{color:var(--ng)}
button{appearance:none;border:0;border-radius:10px;padding:13px 16px;font-size:1rem;font-weight:700;background:var(--ok);color:#fff;width:100%;margin:.25rem 0 .75rem;cursor:pointer}
button.copy{background:transparent;border:1px solid var(--line);color:var(--fg)}
footer{color:var(--muted);font-size:.75rem;margin-top:1.5rem;text-align:center}
</style>
</head>
<body>
<main>
<p class="banner">✅ GitHub Pages の表示に成功しています</p>
<h1>オフライン画像・文書 意味検索</h1>
<p class="sub">v0.1 環境チェック（卒業研究・開発版）</p>
<button id="run" type="button">この端末の対応状況を判定する</button>
<ul id="list"></ul>
<button id="copy" class="copy" type="button" hidden>判定結果をコピー（チャット貼り付け用）</button>
<footer>このページは通信を行いません（AIモデルは未搭載です）<br>リポジトリ: 224096-cmd/offline-photo-search</footer>
</main>
<script>
"use strict";
var items = [];
var list = document.getElementById("list");

function row(key, value, ok) {
  items.push({ key: key, value: String(value), ok: (ok === undefined ? null : ok) });
  var li = document.createElement("li");
  var k = document.createElement("span");
  k.className = "k";
  k.textContent = key;
  var v = document.createElement("span");
  v.className = "v" + (ok === true ? " ok" : ok === false ? " ng" : "");
  v.textContent = String(value);
  li.appendChild(k);
  li.appendChild(v);
  list.appendChild(li);
}

async function run() {
  list.innerHTML = "";
  items.length = 0;

  row("判定日時", new Date().toLocaleString("ja-JP"));
  row("ブラウザ (UserAgent)", navigator.userAgent);

  // WebGPU（ブラウザからGPUを使う新API。埋め込みモデルの高速実行に使用）
  try {
    if (!("gpu" in navigator)) {
      row("WebGPU", "非対応（WASMで動作予定）", false);
    } else {
      var adapter = await navigator.gpu.requestAdapter();
      if (adapter) {
        var info = "";
        try {
          if (adapter.info) {
            info = " / " + [adapter.info.vendor, adapter.info.architecture].filter(Boolean).join(" ");
          }
        } catch (e) { /* info非対応環境 */ }
        row("WebGPU", "対応" + info, true);
      } else {
        row("WebGPU", "アダプタ取得失敗（WASMで動作予定）", false);
      }
    }
  } catch (e) {
    row("WebGPU", "エラー: " + e.message, false);
  }

  row("WebAssembly (WASM)", typeof WebAssembly === "object" ? "対応" : "非対応", typeof WebAssembly === "object");
  row("Service Worker", "serviceWorker" in navigator ? "対応（オフライン化に使用予定）" : "非対応", "serviceWorker" in navigator);
  row("クロスオリジン分離", (typeof crossOriginIsolated !== "undefined" && crossOriginIsolated) ? "有効" : "無効（マルチスレッドWASMは不可。必要なら後でService Workerで対応）");

  try {
    var est = await navigator.storage.estimate();
    row("ストレージ割当の目安", Math.round((est.quota || 0) / 1048576) + " MB（使用中 " + Math.round((est.usage || 0) / 1048576) + " MB）", true);
  } catch (e) {
    row("ストレージ割当の目安", "取得できませんでした");
  }

  row("画面", screen.width + "×" + screen.height + " @" + window.devicePixelRatio + "x");
  if (navigator.deviceMemory) {
    row("搭載メモリ（概算）", navigator.deviceMemory + " GB 以上");
  }
  row("表示モード", window.matchMedia("(display-mode: standalone)").matches ? "ホーム画面から起動（PWA）" : "ブラウザ内で表示");

  document.getElementById("copy").hidden = false;
}

document.getElementById("run").addEventListener("click", run);

document.getElementById("copy").addEventListener("click", async function () {
  var text = JSON.stringify({ app: "offline-photo-search v0.1", checkedAt: new Date().toISOString(), results: items }, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    alert("コピーしました。チャットに貼り付けてください。");
  } catch (e) {
    window.prompt("以下を全選択してコピーしてください", text);
  }
});
</script>
</body>
</html>
